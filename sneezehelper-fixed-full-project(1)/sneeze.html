<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sneeze Helper</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="screen" class="dark" aria-live="polite">
  <section id="prep" class="panel">
    <div class="sun">☀</div>
    <h1>Turn up your screen brightness</h1>
    <p class="note">Bright light can trigger the photic sneeze reflex in some people.</p>
    <button id="start">Start countdown</button>
  </section>
  <div id="countdown" class="countdown hidden"></div>
  <section id="after" class="after hidden">
    <h1>Did it work?</h1>
    <button id="again">Again</button><button id="close">Close</button>
  </section>
</main><script src="sneeze.js"></script></body></html>
